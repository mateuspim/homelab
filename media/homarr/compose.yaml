services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homarr-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-socket

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    depends_on:
      - socket-proxy
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in .env}
      DOCKER_HOSTNAMES: socket-proxy
      DOCKER_PORTS: "2375"
    ports:
      - "7575:7575"
    volumes:
      - /home/pym/homarr/appdata:/appdata
    networks:
      - docker-socket

networks:
  docker-socket:
    name: homarr-docker-socket
