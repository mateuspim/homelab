# Jellystat on CT 225 (watch statistics for Jellyfin on .222). Based on upstream docker-compose.yml at 1.1.12.
# Connect to Jellyfin in the UI: http://192.168.50.222:8096 + a Jellyfin API key (Dashboard → API Keys).
name: jellystat

services:
  jellystat-db:
    image: docker.io/library/postgres:18
    container_name: jellystat-db
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/appdata/jellystat-db:/var/lib/postgresql   # postgres 18 layout (data in 18/docker below this)
    healthcheck:
      test: pg_isready --dbname=postgres --username=postgres
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jellystat:
    image: docker.io/cyfershepard/jellystat:1.1.12
    container_name: jellystat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      TZ: America/Sao_Paulo
    volumes:
      - /opt/appdata/jellystat/backup-data:/app/backend/backup-data
    ports: ["3000:3000"]
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
