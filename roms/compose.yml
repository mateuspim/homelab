networks:
  rommnetwork:
    ipam:
      config:
        - subnet: 172.23.0.0/24

volumes:
  romm_mysql_data:
  romm_resources:
  romm_redis_data:

services:
  romm:
    image: rommapp/romm:5.0.0
    container_name: romm
    restart: unless-stopped
    env_file:
      - /docker/romm/.env
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - TZ=America/Sao_Paulo
      - HASHEOUS_API_ENABLED=true
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      - /mnt/roms:/romm/library/roms
      - /docker/romm/assets:/romm/assets
      - /docker/romm/config:/romm/config
    ports:
      - 2000:8080
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    networks:
      rommnetwork:
        ipv4_address: 172.23.0.10

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    env_file:
      - /docker/romm/.env
    environment:
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - TZ=America/Sao_Paulo
    volumes:
      - romm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      rommnetwork:
        ipv4_address: 172.23.0.11
